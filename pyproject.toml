[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Plataforma personal de IA híbrida con agentes especializados, memoria persistente y ejecución verificable"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "huey>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.0",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/jarvis"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security)
]
ignore = [
    "S101",  # assert usado en tests
    "S110",  # try-except-pass (intencional para optional imports)
    "S603",  # subprocess sin shell=True (intencional)
    "S607",  # partial executable path (npx, claude)
    "S608",  # SQL string building (consultas internas, no user input)
    "E501",  # line too long (manejado por line-length)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]
"src/jarvis/cli.py" = ["B008"]
"src/jarvis/llm/claude_code.py" = ["B904"]
